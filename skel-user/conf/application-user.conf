include "default-core"
include "default-http"
include "default-user"

http {
  routes {
    ask-timeout = 5s
  }
}

akka.http.server.request-timeout = 6s
#akka.http.host-connection-pool.max-connections = 100
#akka.http.host-connection-pool.pipelining-limit = 3

blocking-dispatcher {
  type = Dispatcher
  executor = "thread-pool-executor"
  thread-pool-executor {
    fixed-pool-size = 16
  }
  throughput = 4
}


mysql {
  dataSourceClassName=com.mysql.cj.jdbc.MysqlDataSource
  dataSource.url="jdbc:mysql://localhost:3306/user_db"
  dataSource.user=user_user
  dataSource.password=user_pass
  connectionTimeout=30000
  idleTimeout=30000
  minimumIdle=5
  maximumPoolSize=20
  poolName=DB-Pool
  maxLifetime=2000000
}

# Async postgres
postgres {
  dataSourceClassName=org.postgresql.ds.PGSimpleDataSource
  #url="jdbc:postgresql://localhost:5432"
  url="jdbc:postgresql://1111111111111111111111111111111111111111111:5432"
  dataSource.url="jdbc:postgresql://2222222222222222222222222222222222222222222222222222:5432"
  #host=localhost  
  database=user_db
  username=${DB_USER}
  password=${DB_PASS}
  dataSource.connectionProperties="TimeZone=UTC;binaryTransfer=false;disableTimeZone=true"
  numThreads = 10  
}

# Async postgres with Schema
postgres_schema {
  dataSourceClassName=org.postgresql.ds.PGSimpleDataSource
  url="jdbc:postgresql://localhost:5432?currentSchema=user_schema"
  #host=localhost  
  database=user_db
  username=${DB_USER}
  password=${DB_PASS}
  dataSource.connectionProperties="TimeZone=UTC;binaryTransfer=false;disableTimeZone=true"
  numThreads = 10  
}

# Async postgres
postgres0 {
  dataSourceClassName=org.postgresql.ds.PGSimpleDataSource
  url="jdbc:postgresql://localhost:5432/user_db?user=user_user&password=user_pass"  
  numThreads = 10  
}

# Sync postres
postgres1 {
  dataSourceClassName=org.postgresql.ds.PGSimpleDataSource
  dataSource.url=${?DB_URL}
  dataSource.user=${?DB_USER}
  dataSource.password=${?DB_PASS}
  connectionTimeout=30000
  idleTimeout=30000
  minimumIdle=5
  maximumPoolSize=20
  poolName=DB-Pool
  maxLifetime=2000000
}

# Sync postgres
postgres2 {
  dataSourceClassName=org.postgresql.ds.PGSimpleDataSource
  #dataSource.url="jdbc:postgresql://172.17.0.1:5432/user_db"
  dataSource.url="jdbc:postgresql://localhost:5432/user_db"
  dataSource.user=user_user
  dataSource.password=user_pass
  dataSource.connectionProperties="TimeZone=UTC;binaryTransfer=false;disableTimeZone=true"
  connectionTimeout=30000
  idleTimeout=30000
  minimumIdle=5
  maximumPoolSize=20
  poolName=DB-Pool
  maxLifetime=2000000
}

mysql_async {
  dataSourceClassName=com.mysql.cj.jdbc.MysqlDataSource
  url="jdbc:mysql://localhost:3306/user_db?user=user_user&password=user_pass"
  numThreads = 10  
}

# Use postgres_schema block (currentSchema=user_schema); requires db-schema.sql applied first
# datastore="postgres://postgres_schema"
datastore="mem://"


http {
  port=8080
}
