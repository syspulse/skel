include "default-core"
include "default-http"

http {
  routes {
    # LLM questions can take a long time to answer
    ask-timeout = 60s
  }
}

# Timeout for HTTP should be bigger than ask-timeout
akka.http.server.request-timeout = 120s

# timeout for Agent/LLM questions
timeout = 60000

mysql {
  dataSourceClassName=com.mysql.cj.jdbc.MysqlDataSource
  dataSource.url="jdbc:mysql://localhost:3306/dash_db"
  dataSource.user=dash_user
  dataSource.password=dash_pass
  connectionTimeout=30000
  idleTimeout=30000
  minimumIdle=5
  maximumPoolSize=20
  poolName=DB-Pool
  maxLifetime=2000000
}

postgres {
  dataSourceClassName=org.postgresql.ds.PGSimpleDataSource
  dataSource.url=${?DB_URI}
  dataSource.user=${?DB_USER}
  dataSource.password=${?DB_PASS}
  connectionTimeout=30000
  idleTimeout=30000
  minimumIdle=5
  maximumPoolSize=20
  poolName=DB-Pool
  maxLifetime=2000000
}

postgres2 {
  dataSourceClassName=org.postgresql.ds.PGSimpleDataSource
  dataSource.url="jdbc:postgresql://localhost:5432/dash_db"  
  dataSource.user=dash_user
  dataSource.password=dash_pass
  connectionTimeout=30000
  idleTimeout=30000
  minimumIdle=5
  maximumPoolSize=20
  poolName=DB-Pool
  maxLifetime=2000000
}

datastore = "dir:///mnt/s3/data/dev/dashboard"

ds = """many://
  test://,
  ess://{ES_USER}:{ES_PASS}@{ES_HOST}?compress=true,
  dune://{DUNE_API_KEY},
  coingecko://{CG_API_KEY}
"""