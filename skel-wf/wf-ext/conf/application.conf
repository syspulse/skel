include "default-core"
include "default-http"
include "default-wf"

http {
  routes {
    ask-timeout = 160s
  }
}

postgres {
  dataSourceClassName=org.postgresql.ds.PGSimpleDataSource
  url=${?DB_URL}
  #host=localhost  
  database=${?DB_DATABASE}
  username=${?DB_USER}
  password=${?DB_PASS}
  dataSource.connectionProperties="TimeZone=UTC;binaryTransfer=false;disableTimeZone=true"
  numThreads = 16  
}

# search=fts|tgram|fts,tgram — index kinds (not the postgres JDBC url)
datastore = "jdbc://postgres?search=tgram"

engine {
  uri="temporal://${TEMPORAL_GRPC}/ext_workflows?tls=ignore&auth=${ACCESS_TOKEN_TEMPORAL}"
  url="https://${TEMPORAL_URL}"
}
