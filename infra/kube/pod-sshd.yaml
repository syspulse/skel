apiVersion: v1
kind: Pod
metadata:
  name: sshd
spec:
  containers:
  - name: sshd
    image: alpine:latest
    ports:
    - containerPort: 22
      name: ssh
    command: ["/bin/sh", "-c"]
    args:
      - |
        apk add --no-cache openssh openssh-server
        ssh-keygen -A
        mkdir -p /root/.ssh
        sed -i 's/^[^#]*PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
        sed -i 's/^[^#]*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
        sed -i 's/^[^#]*AllowTcpForwarding.*/AllowTcpForwarding yes/' /etc/ssh/sshd_config
        sed -i 's/^[^#]*GatewayPorts.*/GatewayPorts yes/' /etc/ssh/sshd_config
        sed -i 's/^[^#]*LogLevel.*/LogLevel ERROR/' /etc/ssh/sshd_config
        echo "" >> /etc/ssh/sshd_config
        echo "# Custom configuration for SOCKS proxy" >> /etc/ssh/sshd_config
        echo "PermitRootLogin yes" >> /etc/ssh/sshd_config
        echo "PasswordAuthentication yes" >> /etc/ssh/sshd_config
        echo "AllowTcpForwarding yes" >> /etc/ssh/sshd_config
        echo "GatewayPorts yes" >> /etc/ssh/sshd_config
        echo "LogLevel ERROR" >> /etc/ssh/sshd_config
        PASSWORD=$(tr -dc 'a-zA-Z0-9' < /dev/urandom | head -c 20)
        echo "root:${PASSWORD}" | chpasswd
        echo "=== SSH Configuration ==="
        grep -E '^(PermitRootLogin|PasswordAuthentication|AllowTcpForwarding|GatewayPorts)' /etc/ssh/sshd_config | tail -4
        echo "========================="
        echo "Root password: ${PASSWORD}"
        echo "sshd starting..."
        /usr/sbin/sshd -D -e
    securityContext:
      privileged: false
    resources:
      requests:
        memory: "64Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "500m"

