apiVersion: v1
kind: Pod
metadata:
  name: sshd-proxy
  namespace: ingest
  labels:
    app: sshd-proxy
spec:
  containers:
  - name: sshd-proxy
    image: alpine:latest
    ports:
    - containerPort: 22
      name: ssh
    command: ["/bin/sh", "-c"]
    args:
      - |
        apk add --no-cache openssh openssh-server
        ssh-keygen -A
        mkdir -p /root/.ssh
        sed -i 's/^[^#]*PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
        sed -i 's/^[^#]*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
        sed -i 's/^[^#]*AllowTcpForwarding.*/AllowTcpForwarding yes/' /etc/ssh/sshd_config
        sed -i 's/^[^#]*GatewayPorts.*/GatewayPorts yes/' /etc/ssh/sshd_config
        echo "" >> /etc/ssh/sshd_config
        echo "# Custom configuration for SOCKS proxy" >> /etc/ssh/sshd_config
        echo "PermitRootLogin yes" >> /etc/ssh/sshd_config
        echo "PasswordAuthentication yes" >> /etc/ssh/sshd_config
        echo "AllowTcpForwarding yes" >> /etc/ssh/sshd_config
        echo "GatewayPorts yes" >> /etc/ssh/sshd_config
        PASSWORD=$(tr -dc 'a-zA-Z0-9' < /dev/urandom | head -c 20)
        #PASSWORD=b6c68562500db49107dc
        echo "root:${PASSWORD}" | chpasswd
        echo "=== SSH Configuration ==="
        grep -E '^(PermitRootLogin|PasswordAuthentication|AllowTcpForwarding|GatewayPorts)' /etc/ssh/sshd_config | tail -4
        echo "========================="
        echo "Root password: ${PASSWORD}"
        echo "sshd starting..."
        /usr/sbin/sshd -D -e
    securityContext:
      privileged: false
    resources:
      requests:
        memory: "64Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: sshd-proxy-service
  namespace: ingest
  labels:
    app: sshd-proxy
spec:
  type: ClusterIP
  ports:
  - port: 22
    targetPort: 22
    protocol: TCP
    name: ssh
  selector:
    app: sshd-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: sshd-proxy-service-lb
  namespace: ingest
  labels:
    app: sshd-proxy
  annotations:
    # AWS Load Balancer Controller annotations for EKS
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"  # Use NLB for TCP/SSH
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"  # or "internal"
    # Optional: Specify subnets for internal load balancer
    # service.beta.kubernetes.io/aws-load-balancer-subnets: "subnet-xxx,subnet-yyy"
    # Optional: Add tags
    # service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: "Environment=prod,Team=devops"
spec:
  type: LoadBalancer
  # Note: loadBalancerClass requires Kubernetes 1.24+
  # If using older K8s version, remove this line - annotations are sufficient
  loadBalancerClass: service.k8s.aws/nlb  # Use AWS Load Balancer Controller
  ports:
  - port: 22
    targetPort: 22
    protocol: TCP
    name: ssh
  selector:
    app: sshd-proxy
---
# ConfigMap for nginx-ingress TCP passthrough (optional)
# Uncomment and apply if you want to use nginx-ingress for SSH
# Note: Replace 'default' with your namespace if different
# apiVersion: v1
# kind: ConfigMap
# metadata:
#   name: tcp-services
#   namespace: ingress-nginx
# data:
#   "22": "ingest/sshd-proxy-service:22"
---
# USAGE INSTRUCTIONS FOR EKS:
#
# Prerequisites:
#   - AWS Load Balancer Controller must be installed in your cluster
#   - IAM permissions for the controller to create ELB/NLB resources
#
# Option 1: Use AWS NLB hostname directly (Easiest)
#   1. kubectl apply -f sshd-service-ingress.yaml
#   2. Wait for LoadBalancer to be created (may take 1-2 minutes)
#   3. Get the hostname: kubectl get svc -n ingest sshd-proxy-service-lb -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'
#   4. Get password: kubectl logs -n ingest sshd-proxy | grep "Root password"
#   5. Connect using AWS hostname: ssh root@<nlb-hostname>
#     Example: ssh root@k8s-default-sshdpr-xxxxx.us-east-1.elb.amazonaws.com
#
# Option 2: Create Route53 DNS record (Recommended for production)
#   1. Get the NLB hostname: kubectl get svc -n ingest sshd-proxy-service-lb -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'
#   2. Create Route53 A record (alias):
#      - Name: sshd.example.com (your DNS name)
#      - Type: A - IPv4 address
#      - Alias: Yes
#      - Alias target: Select the NLB hostname from step 1
#   3. Wait for DNS propagation (usually a few minutes)
#   4. Connect: ssh root@sshd.example.com
#
# Option 3: Use Route53 with CNAME (if alias not available)
#   1. Get the NLB hostname: kubectl get svc -n ingest sshd-proxy-service-lb -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'
#   2. Create Route53 CNAME record:
#      - Name: sshd.example.com
#      - Type: CNAME
#      - Value: <nlb-hostname>
#   3. Connect: ssh root@sshd.example.com
#
# Option 4: nginx-ingress with TCP passthrough (if you prefer)
#   1. Uncomment and apply the ConfigMap above
#   2. Restart nginx-ingress controller: kubectl rollout restart deployment -n ingress-nginx
#   3. Get ingress controller hostname: kubectl get svc -n ingress-nginx ingress-nginx-controller
#   4. Point DNS to ingress controller's hostname
#   5. Connect via DNS name: ssh root@sshd.example.com
#
# For SOCKS proxy:
#   ssh -D 127.0.0.1:1090 -N -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@<hostname>
#
# Troubleshooting:
#   - Check LoadBalancer status: kubectl describe svc -n ingest sshd-proxy-service-lb
#   - View AWS Load Balancer Controller logs: kubectl logs -n kube-system -l app.kubernetes.io/name=aws-load-balancer-controller
#   - Verify NLB exists in AWS Console: EC2 > Load Balancers

